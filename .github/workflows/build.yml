name: Sestavení Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalace knihoven
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sestavení EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZvukovySpoustec --collect-all soundcard zvukovy_spoustec.py

      - name: Uložení EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZvukovySpoustec-Windows
          path: dist/ZvukovySpoustec.exe
          retention-days: 30
